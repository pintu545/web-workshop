<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <title>hyx的个人网页</title>
    <link rel="stylesheet" href="./index.css" />
    <style>
      :root {
        --primary: #4f6ef7;
        --accent: #f78fb3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
        background: linear-gradient(135deg, #a6c1ee 0%, #fbc2eb 100%);
        background-attachment: fixed;
        color: #333;
      }

      .back-link {
        display: inline-block;
        margin: 16px;
        padding: 8px 16px;
        color: #4f6ef7;
        text-decoration: none;
        border-radius: 999px;
        background-color: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(8px);
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .back-link:hover {
        transform: translateY(-2px);
        background-color: rgba(255, 255, 255, 0.8);
      }

      #about-me-frame {
        max-width: 880px;
        margin: 0 auto;
        padding: 24px 16px 48px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }

      .card {
        padding: 24px;
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.35);
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(12px);
      }

      #profile {
        grid-column: 1 / -1;
        text-align: center;
      }

      #avatar {
        width: 96px;
        height: 96px;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: bold;
        color: #fff;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      #profile h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }

      #profile .subtitle {
        margin: 0;
        color: #555;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 20px;
        color: #2c3e50;
        border-left: 4px solid var(--primary);
        padding-left: 10px;
      }

      p,
      li {
        line-height: 1.8em;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tag-list li {
        padding: 6px 14px;
        border-radius: 999px;
        background-color: rgba(79, 110, 247, 0.15);
        color: #3b5bdb;
        font-size: 14px;
      }

      .hobby-list {
        margin: 0;
        padding-left: 20px;
      }

      .contact-table {
        width: 100%;
        border-collapse: collapse;
      }

      .contact-table th,
      .contact-table td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }

      .contact-table th {
        width: 84px;
        color: #555;
      }

      .contact-table a {
        color: #4f6ef7;
        text-decoration: none;
      }

      footer {
        text-align: center;
        padding: 16px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="./index.html">&larr; 返回首页</a>
    <div id="about-me-frame">
      <div class="card" id="profile">
        <div id="avatar">hyx</div>
        <h1>hyx</h1>
        <p class="subtitle" id="greeting">你好，欢迎来到我的个人网页</p>
      </div>

      <div class="card">
        <h2>关于我</h2>
        <p>
          大家好，我是 <strong>hyx</strong>，一名电子系的在校学生。目前正在学习暑期培养课程。
          
        </p>
        
      </div>

      <div class="card">
        <h2>我的技能</h2>
        <ul class="tag-list">
          <li>HTML</li>
          <li>CSS</li >
        </ul>
      </div>

      <div class="card">
        <h2>兴趣爱好</h2>
        <ul class="hobby-list">
          <li>听音乐、看电影</li>
          <li>羽毛球、骑行、乒乓球</li>
          <li>看游戏实况</li>
        </ul>
      </div>

      <div class="card">
        <h2>联系方式</h2>
        <table class="contact-table">
          <tr>
            <th>邮箱</th>
            <td><a href="mailto:huangyx25@mails.tsinghua.edu.cn">huangyx25@mails.tsinghua.edu.cn</a></td>
          </tr>
          
          <tr>
            <th>主页</th>
            <td><a href="./index.html">返回项目首页</a></td>
          </tr>
        </table>
      </div>
    </div>
    <footer>&copy; 2026 hyx &middot; 感谢访问</footer>

    <script>
      const greetingDOM = document.getElementById("greeting");
      const hour = new Date().getHours();
      let greeting;
      if (hour < 6) {
        greeting = "夜深了，注意休息哦";
      } else if (hour < 9) {
        greeting = "早上好，欢迎来到我的个人网页";
      } else if (hour < 12) {
        greeting = "上午好，欢迎来到我的个人网页";
      } else if (hour < 14) {
        greeting = "中午好，欢迎来到我的个人网页";
      } else if (hour < 18) {
        greeting = "下午好，欢迎来到我的个人网页";
      } else {
        greeting = "晚上好，欢迎来到我的个人网页";
      }
      greetingDOM.innerText = greeting;
    </script>
  </body>
</html>
